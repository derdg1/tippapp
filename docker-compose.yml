services:
  pocketbase:
    build: ./pocketbase
    environment:
      PREDICTOR_URL: http://predictor:8000
    volumes:
      - pb_data:/pb/pb_data
    ports:
      - '8090:8090'
    depends_on:
      - predictor
    restart: unless-stopped

  predictor:
    build: ./predictor
    environment:
      PB_URL: http://pocketbase:8090
      MODEL_PATH: /app/models/model.joblib
    volumes:
      - predictor_data:/app/models
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      PUBLIC_PB_URL: ${PUBLIC_PB_URL:-http://localhost:8090}
    ports:
      - '3000:3000'
    depends_on:
      - pocketbase
    restart: unless-stopped

volumes:
  pb_data:
  predictor_data:
